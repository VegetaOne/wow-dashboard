services:
  app:
    build: .
    ports:
      - "3000:3000"

    # Keine .env nötig: Region, Sprache und die Battle.net-Zugangsdaten
    # werden beim ersten Aufruf der Website abgefragt und liegen danach
    # in der Datenbank. Geändert werden sie unter Einstellungen.
    environment:
      # Pfad im Volume - hier gehört er hin, nicht in die Konfiguration:
      # ohne ihn findet die App die Datenbank gar nicht erst.
      - DATABASE_URL=file:/data/wow-dashboard.db

    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data:
